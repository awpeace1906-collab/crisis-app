name: CRISIS
options:
  bundleIdPrefix: com.criticalvector
  deploymentTarget:
    iOS: "17.0"
  createIntermediateGroups: true
settings:
  base:
    SWIFT_VERSION: "5.0"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
targets:
  CRISIS:
    type: application
    platform: iOS
    sources:
      - path: CRISIS
    resources:
      - path: CRISIS/Resources
        type: folder
      - path: CRISIS/Assets.xcassets
    info:
      path: CRISIS/Info.plist
      properties:
        CFBundleDisplayName: CRISIS
        UILaunchScreen: {}
        UISupportedInterfaceOrientations:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
        UISupportedInterfaceOrientations~ipad:
          - UIInterfaceOrientationPortrait
          - UIInterfaceOrientationPortraitUpsideDown
          - UIInterfaceOrientationLandscapeLeft
          - UIInterfaceOrientationLandscapeRight
        UIAppFonts:
          - "Syne[wght].ttf"
          - "SourceSerif4[opsz,wght].ttf"
          - "SourceSerif4-Italic[opsz,wght].ttf"
          - IBMPlexMono-Regular.ttf
          - IBMPlexMono-Medium.ttf
          - IBMPlexMono-SemiBold.ttf
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.criticalvector.crisis
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        TARGETED_DEVICE_FAMILY: "1,2"
